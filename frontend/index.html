<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07080d" />
  <title>Local LLM Agent – MCA010</title>
  <meta name="description" content="Local LLM-based AI agent for study assistance, data analysis, code documentation and x402 micropayments. MCA010, JSS University, Noida." />
  <!-- Favicon: inline SVG (gradient orb with an "A"), so no extra file is needed -->

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%238b93ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' fill='url(%23g)'/%3E%3Cpath d='M32 14 18 50h8l3-8h14l3 8h8L32 14Zm0 15 5 8H27l5-8Z' fill='%2304130f'/%3E%3C/svg%3E" />
  <style>
    /* Paint the page dark immediately, before the CSS bundle loads, so there is no white flash. */
    html { background: #07080d; }
    html:not(.dark) { background: #f3f5fa; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    /* Set the theme before first paint so there is no white flash. Default is dark. */
    try {
      var t = localStorage.getItem("theme");
      var dark = t ? t === "dark" : true;
      document.documentElement.classList.toggle("dark", dark);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", dark ? "#07080d" : "#f3f5fa");
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
